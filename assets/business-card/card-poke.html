// Embedded in the portfolio's full-screen overlay: Esc closes it from inside the frame too.
const embedded = window.parent !== window;
if (embedded) document.documentElement.classList.add('embedded');
if (embedded) addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); window.parent.postMessage({ type: 'portfolio-card:close' }, location.origin); } });
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const canvas = document.getElementById('stage');
const sideStatus = document.getElementById('side-status');
const soundBtn = document.getElementById('sound');

// Shades only, stepped in order (black, gray, white, gray, back) on each wall hit.
const THEMES = [
  { bg: '#0E0E0E', fg: '#F2F2F0', shadow: 0.55 }, // near-black
  { bg: '#2B2B2B', fg: '#F2F2F0', shadow: 0.55 }, // charcoal
  { bg: '#7A7A7A', fg: '#0E0E0E', shadow: 0.42 }, // mid gray
  { bg: '#CFCFCF', fg: '#0E0E0E', shadow: 0.34 }, // light gray
  { bg: '#F2F2F0', fg: '#0E0E0E', shadow: 0.30 }, // off-white
];
let themeIndex = 0, themeDir = 1, shadowTarget = THEMES[0].shadow;
function nextTheme() {
  if (themeIndex + themeDir < 0 || themeIndex + themeDir >= THEMES.length) themeDir = -themeDir;
  themeIndex += themeDir;
  const t = THEMES[themeIndex];
  document.documentElement.style.setProperty('--bg', t.bg);
  document.documentElement.style.setProperty('--fg', t.fg);
  document.querySelector('meta[name=theme-color]').setAttribute('content', t.bg);
  shadowTarget = t.shadow; S.hits++;
  if (embedded) window.parent.postMessage({ type: 'portfolio-card:shade', index: themeIndex }, location.origin);
}

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; // edge only; too hot for the paper faces without tone mapping
const camera = new THREE.PerspectiveCamera(26, 1, 10, 20000);
const key = new THREE.DirectionalLight(0xfff6e8, 0.55); key.position.set(-0.6, 0.9, 1.2); scene.add(key);
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

const faceMat = map => new THREE.MeshPhysicalMaterial({

// 3M-like retroreflective edge: bright, slightly metallic, iridescent sheen as it turns

const front = new THREE.Mesh(faceGeo(), frontMat); front.position.z = CT / 2 + 0.0004;
const back = new THREE.Mesh(faceGeo(), backMat); back.position.z = -CT / 2 - 0.0004; back.rotation.y = Math.PI;

card.add(front, back, sides);
const squishG = new THREE.Group();            // screen-aligned squish (jelly on impact)
const spinG = new THREE.Group();              // in-plane spin
const root = new THREE.Group();               // position + size
spinG.add(card); squishG.add(spinG); root.add(squishG); scene.add(root);

// Soft shadow behind the card
const sc = document.createElement('canvas'); sc.width = sc.height = 128;
{ const c = sc.getContext('2d'), g = c.createRadialGradient(64, 64, 6, 64, 64, 64);
  g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(0.55, 'rgba(0,0,0,0.18)'); g.addColorStop(1, 'rgba(0,0,0,0)');

// Physics state, screen px (y down), seconds
let VW = innerWidth, VH = innerHeight, W = 0, H = 0;
const S = {
  x: 0, y: 0, vx: 0, vy: 0,
  rz: 0, wz: 0,                // in-plane spin (screen, clockwise +)
  rx: 0, ry: 0, wx: 0, wy: 0,  // tilt / flip (three axes)
  sq: 0, vsq: 0, sqAxis: 0,    // squish amount and axis (0 = x, 1 = y)
  press: 0, vpress: 0,         // poke press-in
  lastInput: 0, hits: 0,
};
function sizeCard() {

  H = W / ASPECT;
  const fovR = THREE.MathUtils.degToRad(camera.fov);
  camera.aspect = VW / VH; camera.position.set(0, 0, (VH / 2) / Math.tan(fovR / 2)); camera.updateProjectionMatrix();

const extents = () => {

let started = false;

// Sound (synthesized, like the thump/click presets on iansilber.com)

soundBtn.addEventListener('click', e => { soundOn = !soundOn; soundBtn.textContent = soundOn ? 'sound on' : 'sound off'; soundBtn.setAttribute('aria-pressed', String(soundOn)); });

// Picking
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

const LINKS = [
  { face: 'front', u0: 0.4182, u1: 0.5818, v0: 0.0605, v1: 0.1307, href: 'https://bashsystems.net/' },
  { face: 'back',  u0: 0.3766, u1: 0.6234, v0: 0.7825, v1: 0.8607, href: 'mailto:navy@bashsystems.net' },

function pick(cx, cy) {

  const uv = hit.uv ? { u: hit.uv.x, v: hit.uv.y } : null;

function openLink(href) {

// Input: drag/throw, poke (tap), double-tap flip, wall squeeze + release = slingshot

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);

let lastHitTheme = 0;

// Integrator
